name: Model Retraining on Push

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "data/**"
      - "requirements.txt"
      - ".github/workflows/model_retraining_on_push.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate model version (UTC timestamp + commit SHA)
        run: echo "VERSION=$(date -u +'%Y%m%d%H%M%S')-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Train model
        run: python src/train_model.py --version "$VERSION"

      - name: Evaluate model
        run: python src/evaluate_model.py --version "$VERSION"

      - name: Commit and push versioned model + metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add models/ metrics/
          git commit -m "ci: train xG model $VERSION"
          git pull --rebase
          git push
