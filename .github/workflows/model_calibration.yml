name: Model Calibration

on:
  workflow_run:
    workflows: ["Model Retraining on Push"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  calibrate:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Read latest model version
        run: echo "VERSION=$(cat models/latest_version.txt)" >> "$GITHUB_ENV"

      - name: Calibrate model (Platt scaling)
        run: python src/calibrate_model.py --version "$VERSION" --method sigmoid

      - name: Evaluate calibrated model
        run: python src/evaluate_model.py --version "$VERSION" --calibrated

      - name: Commit and push calibrated model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add models/ metrics/
          git commit -m "ci: calibrate xG model $VERSION"
          git pull --rebase
          git push
